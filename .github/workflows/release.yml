name: Build & Release bundle

on:
  # Tag push cuts a release; main push / manual dispatch build + smoke-test
  # only (no release), so each bundle is proven before it is ever published.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90 # cold compile of whisper/llama/ggml/Piper/espeak (arm64)
    permissions:
      contents: write # create the release on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full arm64 bundle: whisper + llama + ggml/Metal + Piper.
          - arch: arm64
            runner: macos-15
            build_cmd: make build
            tarball_cmd: make tarball
            smoke_root: build/bundle
            artifact: xp_wellys_libs-arm64-macos
          # NOTE: the x86_64-macOS Piper-only bundle (plugin #71/#72) was
          # dropped — GitHub retired the Intel `macos-13` runners, so it can no
          # longer be built in CI (a 2h+ queue that never allocates), and
          # cross-building on an arm64 runner would require patching the pinned
          # espeak-ng submodule. Intel Macs are a shrinking niche with no
          # regression (they keep cloud TTS). The XPWELLYS_LIBS_TTS_ONLY option
          # + xp_wellys_libs::piper target stay — the Windows Piper-only bundle
          # (plugin #73/#74) reuses exactly that machinery on windows-latest.
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools (Ninja, ccache)
        # No LLVM: the build uses the runner's default Apple clang, exactly
        # like the plugin (Apple clang is the ABI match AND the only clang that
        # compiles Apple's SDK headers without -Welaborated-enum-base errors).
        run: brew install ninja ccache

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-${{ matrix.arch }}-libs
          max-size: 2500M
          variant: ccache

      - name: Build bundle
        run: ${{ matrix.build_cmd }}

      - name: Smoke-test — link the bundle exactly as the plugin will
        run: |
          set -euo pipefail
          BUNDLE="$PWD/${{ matrix.smoke_root }}"
          cmake -S smoke -B build/smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DXP_WELLYS_LIBS_ROOT="$BUNDLE" \
            -Wno-dev
          cmake --build build/smoke
          # libpiper + onnxruntime resolve via @loader_path next to the binary.
          cp "$BUNDLE"/lib/libpiper.dylib \
             "$BUNDLE"/lib/libonnxruntime.1.22.0.dylib \
             "$BUNDLE"/lib/libonnxruntime.dylib build/smoke/ 2>/dev/null || true
          ./build/smoke/link_test
          ccache --show-stats

      - name: Package tarball
        run: ${{ matrix.tarball_cmd }}

      - name: Show manifest
        run: cat ${{ matrix.smoke_root }}/manifest.txt

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-*.tar.gz
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}-*.tar.gz
          generate_release_notes: true

  # Linux x64 FULL bundle: whisper + llama + plain-CPU ggml + Piper. A separate
  # job rather than a matrix entry on `build` — that job's steps are macOS-shaped
  # (brew, -DCMAKE_OSX_ARCHITECTURES, the dylib cp), so folding Linux in would
  # need deps_cmd/smoke_cmd/smoke_prep_cmd matrix fields and turn each entry into
  # a disguised shell script. build-windows set the "platform != matrix entry"
  # precedent; follow it.
  #
  # ubuntu-22.04 ON PURPOSE, not 24.04: this is a redistributable prebuilt, so it
  # belongs on the OLDEST base we support. 22.04 gives glibc 2.35, which Debian 12
  # (2.36) and newer can consume; building on 24.04 (2.39) would lock those users
  # out.
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90 # cold compile of whisper/llama/ggml/Piper/espeak
    permissions:
      contents: write # create the release on tags
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools
        # patchelf is REQUIRED (CMakeLists find_program): it rewrites
        # libpiper.so's RUNPATH to $ORIGIN during staging.
        # Deliberately absent: libssl-dev (LLAMA_OPENSSL/CURL=OFF, onnxruntime
        # is prebuilt), libomp-dev (GGML_OPENMP=OFF), BLAS (GGML_BLAS=OFF),
        # libsonic/libpcaudio (libpiper disables both).
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache patchelf

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: Linux-x64-libs
          max-size: 2500M
          variant: ccache

      - name: Build bundle
        run: make build

      - name: Smoke-test — link the bundle exactly as the plugin will
        # No cp of the .so's: CMake gives link_test a BUILD_RPATH pointing at the
        # bundle's lib/, and the bundle carries the libonnxruntime.so.1 SONAME
        # libpiper.so needs.
        run: |
          set -euo pipefail
          cmake -S smoke -B build/smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXP_WELLYS_LIBS_ROOT="$PWD/build/bundle" \
            -Wno-dev
          cmake --build build/smoke
          ./build/smoke/link_test
          ccache --show-stats

      - name: Assert the bundle is portable
        # These three checks catch failures that are INVISIBLE on the runner and
        # only surface on a user's machine, so they are assertions, not review
        # notes. -march=native would SIGILL on older CPUs; a build-machine
        # RUNPATH would fail to load onnxruntime anywhere else; a stray OpenMP
        # dep would leave the consumer with undefined GOMP_*.
        run: |
          set -euo pipefail
          echo "--- libpiper.so RUNPATH (must be \$ORIGIN, not /home/runner/...) ---"
          readelf -d build/bundle/lib/libpiper.so | grep -E 'RUNPATH|RPATH'
          readelf -d build/bundle/lib/libpiper.so | grep -q 'RUNPATH.*\$ORIGIN'
          echo "--- no OpenMP dependency in ggml ---"
          ! nm build/bundle/lib/libggml-cpu.a 2>/dev/null | grep -q 'U GOMP_'
          echo "--- link_test's resolved libs ---"
          ldd build/smoke/link_test
          echo "--- bundle contents ---"
          ls -la build/bundle/lib/

      - name: Package tarball
        run: make tarball

      - name: Assert symlinks survived the tarball
        # If tar dereferenced them the bundle silently grows by ~30 MB and
        # manifest.txt gains hash lines instead of `symlink` lines — the
        # consumer's verify stays green either way, so check it here.
        run: |
          set -euo pipefail
          tar -tvzf xp_wellys_libs-linux-x64-*.tar.gz | grep '^l'

      - name: Show manifest
        run: cat build/bundle/manifest.txt

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: xp_wellys_libs-linux-x64
          path: xp_wellys_libs-linux-x64-*.tar.gz
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xp_wellys_libs-linux-x64-*.tar.gz
          generate_release_notes: true

  # Windows x64 FULL bundle: whisper + llama + ggml (CPU + Vulkan) + Piper.
  # The GPU backend is Vulkan, NOT CUDA — no redist DLLs in the artifact,
  # vulkan-1.dll comes from the graphics driver (X-Plane 12 renders through
  # Vulkan on Windows anyway), and it covers AMD/Intel as a bonus. MSVC on
  # windows-latest; no make (the Makefile is macOS-shaped), cmake is driven
  # directly. Windows carries onnxruntime.dll (not DLL-free — a deliberate
  # tradeoff for the accent-free German voice).
  build-windows:
    runs-on: windows-latest
    # Measured ~11 min cold for the full bundle (the 136 .comp shaders expand
    # into SPIR-V arrays compiled into ggml-vulkan.lib, which is the bulk of it).
    # 45 leaves a 4x margin for a slow runner without letting a hung job sit for
    # hours.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Pinned to the version upstream llama.cpp runs its own windows-vulkan job
      # against: known-good with this submodule pin, including the SPIRV-Headers
      # CMake config that ggml/src/ggml-vulkan/CMakeLists.txt requires via
      # find_package(... CONFIG REQUIRED).
      VULKAN_VERSION: 1.4.313.2
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Patch libpiper for Windows (wide model path + lazy Ort::Env)
        shell: pwsh
        # Two upstream problems, both Windows-only, both kept as patches rather
        # than a submodule fork so the pin stays on upstream piper1-gpl v1.4.2:
        #
        #  1. widepath — piper passes the UTF-8 char* model_path straight to
        #     Ort::Session, which wants ORTCHAR_T* = wchar_t* on Windows (fine
        #     on macOS/Linux, where ORTCHAR_T is char).
        #  2. lazy-ort-env — piper_impl.hpp declares `Ort::Env ort_env` at
        #     NAMESPACE SCOPE. Its constructor calls CreateEnv, which starts
        #     onnxruntime's thread pools and may load further DLLs; as a global
        #     that runs while the module is being mapped, i.e. under the Windows
        #     loader lock, where both are illegal. Result: an access violation
        #     inside Ort::Env::Env before main() is even reached — the process
        #     dies with no output and nothing to catch. Diagnosed from a crash
        #     in the field, where the faulting offset resolved to exactly that
        #     constructor. The patch makes it a function-local static.
        run: |
          git -C third_party/piper1-gpl apply "$PWD/patches/piper-win32-widepath.patch"
          git -C third_party/piper1-gpl apply "$PWD/patches/piper-lazy-ort-env.patch"

      - name: Set up MSVC developer environment
        # Puts cl.exe + the Windows SDK on PATH for CMake's Ninja generator.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK (glslc + Vulkan/SPIRV headers + vulkan-1.lib)
        shell: pwsh
        # The LunarG installer directly, rather than a third-party action: this
        # is what upstream llama.cpp does in its own CI, it pins cleanly, and it
        # keeps one more action out of the supply chain. BUILD-time only — the
        # sole thing that reaches the artifact is the tiny vulkan-1 import lib.
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -o "$env:RUNNER_TEMP/VulkanSDK-Installer.exe" -L `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Configure + build bundle (Ninja + MSVC, full + Vulkan)
        shell: pwsh
        # Ninja (single-config) — NOT the Visual Studio multi-config generator:
        # libpiper hardcodes espeak/ucd static-lib paths WITHOUT a per-config
        # subdir (…/ucd-tools/ucd.lib), which only exist under a single-config
        # generator. Same generator the plugin's Windows build uses.
        run: |
          cmake -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DXPWELLYS_LIBS_TTS_ONLY=OFF -DXPWELLYS_LIBS_VULKAN=ON -Wno-dev
          cmake --build build-win --target bundle

      - name: Assert the bundle is portable
        shell: pwsh
        # Both failure modes are invisible on the runner and only bite in the
        # plugin's link (or, worse, at runtime in the user's cockpit):
        #  1) CRT — a /MD object inside these archives is LNK2005 for the plugin,
        #     or two CRT heaps in one module if it somehow links.
        #  2) Vulkan — ggml-vulkan.lib must actually be in the bundle, and the
        #     loader import lib alongside it.
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($lib in @("whisper.lib","llama.lib","ggml.lib","ggml-base.lib","ggml-cpu.lib","ggml-vulkan.lib")) {
            $p = "build-win/bundle/lib/$lib"
            if (-not (Test-Path $p)) { throw "$lib missing from the bundle" }
            $d = dumpbin /directives $p | Out-String
            if ($d -match 'DEFAULTLIB:\s*"?MSVCRT')    { throw "$lib was built against the DYNAMIC CRT (/MD)" }
            if ($d -notmatch 'DEFAULTLIB:\s*"?LIBCMT') { throw "$lib carries no LIBCMT directive (/MT expected)" }
          }
          if (-not (Test-Path build-win/bundle/lib/vulkan-1.lib)) {
            throw "vulkan-1.lib was not staged — the consuming build would need a Vulkan SDK"
          }

          #  3) piper.dll must stay on the DYNAMIC CRT. It links espeak-ng from an
          #     ExternalProject that inherits compiler flags but not target
          #     properties, so the two halves of the DLL must agree on how the CRT
          #     is chosen. v0.4.0 got this wrong (CMP0091 leaked past the
          #     whisper/llama block) and crashed X-Plane inside piper_create on the
          #     first voice load — invisible on this runner, fatal in the cockpit.
          #     A /MD build imports VCRUNTIME140.dll; a /MT one does not.
          $dep = dumpbin /dependents build-win/bundle/lib/piper.dll | Out-String
          if ($dep -notmatch 'VCRUNTIME140') {
            throw "piper.dll does not import VCRUNTIME140 — it was built against the STATIC CRT, which breaks its espeak-ng half"
          }
          Write-Host "piper.dll is on the dynamic CRT (VCRUNTIME140 import present)"

          Write-Host "--- bundle lib/ ---"
          Get-ChildItem build-win/bundle/lib | Format-Table Name,Length

      - name: Smoke-test — link the bundle exactly as the plugin will
        shell: pwsh
        # Link-only, matching the smoke's stated purpose ("proves the archives
        # link, not that inference runs"). Now that win-x64 is a full bundle
        # this covers the whisper/llama/ggml archive set and the Vulkan backend
        # symbols too — the one real risk of the prebuilt approach. The RUNTIME
        # side is validated by the plugin inside X-Plane (#74): this runner has
        # no Vulkan ICD, and onnxruntime's DLL init fails in a minimal headless
        # CI process (0xC0000142). Both environmental, not bundle defects.
        #
        # MultiThreaded, because that is what the plugin uses and what the
        # bundle's own CRT guard in xp_wellys_libs.cmake demands.
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S smoke -B build-win/smoke -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DXP_WELLYS_LIBS_ROOT="$PWD/build-win/bundle" -Wno-dev
          cmake --build build-win/smoke
          foreach ($exe in @("link_test.exe","piper_link_test.exe","piper_runtime_test.exe")) {
            if (-not (Test-Path "build-win/smoke/$exe")) {
              throw "$exe was not produced — the bundle failed to link"
            }
            Write-Host "$exe linked OK (link-only smoke on Windows)"
          }

      - name: Stage the runtime test for on-target use
        shell: pwsh
        # piper_runtime_test is built but NOT run here: this runner has no voice
        # model and onnxruntime's init is unreliable headless. It is shipped as
        # its own artifact so it can be run ON A REAL MACHINE, where it isolates
        # libpiper from the host application. Bundled with the DLLs it needs, so
        # dropping the folder anywhere and running it is enough.
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path runtime-test | Out-Null
          Copy-Item build-win/smoke/piper_runtime_test.exe runtime-test/
          Copy-Item build-win/bundle/lib/*.dll runtime-test/
          Copy-Item -Recurse build-win/bundle/share/espeak-ng-data runtime-test/
          Get-ChildItem runtime-test | Format-Table Name,Length

      - name: Upload the runtime test (every run)
        uses: actions/upload-artifact@v4
        with:
          name: piper-runtime-test-win-x64
          path: runtime-test
          if-no-files-found: error

      - name: Package tarball
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION.txt).Trim()
          tar -C build-win/bundle -czf "xp_wellys_libs-win-x64-$ver.tar.gz" .
          Write-Host "Wrote xp_wellys_libs-win-x64-$ver.tar.gz"
          Get-FileHash -Algorithm SHA256 "xp_wellys_libs-win-x64-$ver.tar.gz"

      - name: Show manifest
        shell: pwsh
        run: Get-Content build-win/bundle/manifest.txt

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: xp_wellys_libs-win-x64
          path: xp_wellys_libs-win-x64-*.tar.gz
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xp_wellys_libs-win-x64-*.tar.gz
          generate_release_notes: true
